<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 704 244" role="img" aria-labelledby="title desc">
  <title id="title">WISARY Laundry</title>
  <desc id="desc">Logo WISARY Laundry berupa mesin cuci front-load modern dengan pintu bundar, gelombang air, dan gelembung.</desc>
  <defs>
    <linearGradient id="machine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1F3A"/><stop offset="1" stop-color="#1559A6"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D70C9"/><stop offset="1" stop-color="#55C7F2"/></linearGradient>
  </defs>

  <!-- Refined washing-machine mark -->
  <g transform="translate(22 22)">
    <rect width="236" height="236" rx="48" fill="url(#machine)"/>
    <rect x="25" y="25" width="186" height="186" rx="31" fill="#F1F8FF"/>

    <!-- Minimal control panel -->
    <rect x="45" y="44" width="146" height="34" rx="12" fill="#DCEEFF"/>
    <rect x="58" y="54" width="46" height="14" rx="7" fill="#1559A6"/>
    <circle cx="128" cy="61" r="7" fill="#2E8AE6"/>
    <circle cx="151" cy="61" r="7" fill="#55C7F2"/>
    <circle cx="174" cy="61" r="7" fill="#1559A6"/>

    <!-- Washer door with water motion -->
    <circle cx="118" cy="146" r="68" fill="#DCEEFF" stroke="#1559A6" stroke-width="8"/>
    <circle cx="118" cy="146" r="54" fill="url(#water)" stroke="#fff" stroke-width="5"/>
    <path d="M73 154c15-13 30-13 45 0s30 13 45 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".95"/>
    <path d="M78 174c12-9 25-9 38 0s26 9 39 0" fill="none" stroke="#DFF4FF" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <path d="M99 119c8-8 18-8 27 0" fill="none" stroke="#DFF4FF" stroke-width="6" stroke-linecap="round"/>

    <!-- Bubbles and sparkle -->
    <circle cx="59" cy="107" r="10" fill="none" stroke="#55C7F2" stroke-width="5"/>
    <circle cx="184" cy="108" r="8" fill="#55C7F2"/>
    <circle cx="199" cy="88" r="5" fill="#2E8AE6"/>
    <path d="m181 31 4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10Z" fill="#55C7F2"/>

    <!-- Grounding water underline -->
    <path d="M57 225c18 8 39 12 61 12s43-4 61-12" fill="none" stroke="#55C7F2" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(310 76)">
    <text x="0" y="70" font-family="Inter, 'Plus Jakarta Sans', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="5" fill="#0B1F3A">WISARY</text>
    <path d="M5 98h190" fill="none" stroke="url(#water)" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="151" font-family="Inter, 'Plus Jakarta Sans', Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="10" fill="#1559A6">LAUNDRY</text>
  </g>
</svg>
